name: Build Scene ModeSwitch Blocker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source package
        run: |
          mkdir extracted
          unzip -q Scene_ModeSwitch_Blocker_LSPosed_V0.1_src_ready.zip -d extracted
          ls -la extracted/Scene_ModeSwitch_Blocker_LSPosed_V0.1_src

      - name: Build APK
        working-directory: extracted/Scene_ModeSwitch_Blocker_LSPosed_V0.1_src
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp extracted/Scene_ModeSwitch_Blocker_LSPosed_V0.1_src/app/build/outputs/apk/debug/app-debug.apk \
             dist/Scene_ModeSwitch_Blocker_LSPosed_V0.1.apk
          cd dist
          sha256sum Scene_ModeSwitch_Blocker_LSPosed_V0.1.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scene-ModeSwitch-Blocker-V0.1
          path: |
            dist/Scene_ModeSwitch_Blocker_LSPosed_V0.1.apk
            dist/SHA256SUMS.txt
