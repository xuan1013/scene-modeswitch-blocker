name: Build Scene ModeSwitch Blocker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -print
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android 36 SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source package
        run: |
          mkdir -p extracted
          unzip -q Scene_ModeSwitch_Blocker_LSPosed_V0.1_src_ready.zip -d extracted

          PROJECT_DIR="$(dirname "$(find extracted \
            -name settings.gradle -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist

          APK="$(find "$PROJECT_DIR" \
            -path '*/app/build/outputs/apk/debug/app-debug.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" \
            dist/Scene_ModeSwitch_Blocker_LSPosed_V0.1.apk

          cd dist
          sha256sum Scene_ModeSwitch_Blocker_LSPosed_V0.1.apk \
            > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scene-ModeSwitch-Blocker-V0.1
          path: |
            dist/Scene_ModeSwitch_Blocker_LSPosed_V0.1.apk
            dist/SHA256SUMS.txt
